<!DOCTYPE html>
<html>
    <head>
        <meta charset=""
        <title>Form page</title>
    </head>
    <body>
        <h1>Course Registration form</h1>
        <label>First Name</label>
        <input type="text" name="First Name"><br><br>
        <label>Surname</label>
        <input type="text" name="Surname"><br><br>
        <label>Mobile Number</label>
        <input type="tel"><br><br>
        <label>Email</label>
        <input type="email"><br><br>
        <label>Password</label>
        <input type="password"><br><br>
        <label>Confirm password</label>
        <input type="Password"><br><br>
        <label>Date Of Birth</label>
        <input type="date"><br><br>
        <label>Age</label>
        <input type="number"><br><br>
        <label>Gender</label>
        <input type="radio" name="gender" value="M"> <label>Male</label>
        <input type="radio" name="gender" value="F"> <label>FeMale</label>
        <input type="radio" name="gender" value="O"> <label>Others</label> <br><br>
        <label>Select Country</label>
        <select>
            <option value="">India</option>
            <option value="">London</option>
            <option value="">France</option>
            <option value="">USA</option>
            <option value="">Russia</option>
        </select><br><br>
        <label>Upload Picture</label>
        <input type="file"><br><br>
        <button type="reset">clear</button>
        <input type="reset"><br><br>
        <label>Select Course</label>
        <select>
            <option value="">Java Full Stack</option>
            <option value="">Python Full Stack</option>
            <option value="">Data Analytics</option>
            <option value="">AIML</option>
        </select><br><br>
        <label>Delivery Mode</label>
        <input type="radio" name="Delivery Mode" value="On"><label>online</label>
        <input type="radio" name="Delivery Mode" value="Off"><label>offline</label><br><br>
        <label>Institute name</label>
        <input type="text"><br><br>
        <label>Comments</label><br><br>
        <textarea name="comments" rows="10" cols="100"></textarea>

    </body>
</html>
